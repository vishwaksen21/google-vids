[project]
name = "vidsprod"
version = "0.1.0"
description = "Autonomous Google Vids production platform: planning, workflow engine, Vids adapter, QA."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.120",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "playwright>=1.49",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Direct Gemini access. Disabled by default in configuration until data handling is
# approved; installing the SDK does not enable it.
gemini = ["google-genai>=2.25"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
vidsprod = "vidsprod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidsprod"]

[tool.fastapi]
entrypoint = "vidsprod.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs the Postgres test database",
    "live: talks to a real external service; never runs by default",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "FAST"]
# ASYNC230/240: small local file operations (state files, evidence paths) are accepted
# in async code; media work runs in ffmpeg subprocesses.
ignore = ["S101", "B008", "E501", "ASYNC230", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
