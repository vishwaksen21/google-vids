<!doctype html>
<!-- A synthetic harness for testing the adapter's recipe mechanics. It is NOT Google Vids
     and its controls are NOT Vids selectors; tests pair it with their own locator catalogue. -->
<html lang="en"><head><title>Generation harness (test fixture)</title></head>
<body>
<header><button aria-label="Google Account: Vids Tester (vids.tester@example.com)">V</button></header>
<main>
  <button id="open" onclick="document.getElementById('panel').hidden=false; count()">Open generator</button>
  <section id="panel" hidden aria-label="Generator">
    <button onclick="count()">Create</button>
    <label>Prompt <textarea id="prompt" maxlength="4000"></textarea></label>
    <label>Short prompt <textarea id="short" maxlength="10"></textarea></label>
    <label for="duration">Duration</label> <select id="duration">
      <option>3</option><option>4</option><option>5</option><option>6</option><option>7</option>
      <option>8</option><option>9</option><option>10</option></select>
    <button onclick="count()">Landscape</button><button onclick="count()">Portrait</button>
    <button id="gen" onclick="generate()">Generate</button>
  </section>
  <button>Duplicate</button><button>Duplicate</button>
  <div id="results"></div>
</main>
<script>
  window.__clicks = 0; window.__generated = 0;
  function count(){ window.__clicks++; }
  function generate(){
    count();
    setTimeout(function(){
      window.__generated++;
      var card = document.createElement('article');
      card.setAttribute('aria-label', 'Result ' + window.__generated);
      card.className = 'result'; card.textContent = 'Generated clip ' + window.__generated;
      document.getElementById('results').appendChild(card);
    }, 300);
  }
</script>
</body></html>
